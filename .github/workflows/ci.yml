name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck, lint, tests, builds, and smoke checks
        run: pnpm release:check

      - name: Upload extension package
        if: always() && hashFiles('dist/sfyta3-h-v-a-extension.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sfyta3-h-v-a-extension
          path: dist/sfyta3-h-v-a-extension.zip
          if-no-files-found: error
          retention-days: 14
